services:
  api:
    image: rondonqsar/api:local-prod
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      APP_URL: ${WEB_PUBLIC_URL:-http://192.168.1.99:3001}
      BETTER_AUTH_URL: ${WEB_PUBLIC_URL:-http://192.168.1.99:3001}
      DB_HOST: postgres
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    ports:
      - "4001:3000"
    networks:
      - net
    volumes:
      - files_prod:/files
      - /usr/local/bin/Mold2:/mold2/Mold2

  web:
    image: rondonqsar/web:local-prod
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - net
    ports:
      - "3001:3000"

  redis:
    image: redis:alpine
    command: redis-server --maxmemory-policy noeviction --appendonly yes --appendfsync everysec
    restart: unless-stopped
    networks:
      - net
    volumes:
      - redis:/data

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_DATABASE}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - net
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  files_prod:
    driver: nfsvol
  redis:
    driver: nfsvol
  postgres_data:
    driver: nfsvol

networks:
  net:
