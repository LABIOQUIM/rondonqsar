services:
  api:
    image: rondonqsar/api:local-prod
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      APP_URL: ${WEB_PUBLIC_URL:-http://192.168.1.99:3001}
      BETTER_AUTH_URL: ${WEB_PUBLIC_URL:-http://192.168.1.99:3001}
    depends_on:
      - redis
    ports:
      - "4001:3000"
    networks:
      - net
    volumes:
      - files:/files
      - /usr/local/bin/Mold2:/mold2/Mold2

  web:
    image: rondonqsar/web:local-prod
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - net
    ports:
      - "3001:3000"

  redis:
    image: redis:alpine
    command: redis-server --maxmemory-policy noeviction
    restart: unless-stopped
    networks:
      - net
    volumes:
      - redis:/data

volumes:
  files:
    driver: nfsvol
  redis:
    driver: nfsvol

networks:
  net:
